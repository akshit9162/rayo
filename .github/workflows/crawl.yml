name: Crawl, probe and deploy

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Crawl
        env:
          # Code search needs a token allowed to search; GITHUB_TOKEN is the fallback.
          GH_TOKEN: ${{ secrets.CRAWL_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: node bin/crawl.mjs
      - name: Probe changed networks
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node bin/probe.mjs
      - run: node bin/build-site.mjs
      - run: npm test
      - name: Commit the new index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet || git commit -m "Crawl $(date -u +%F)" && git push

  build:
    needs: [crawl]
    if: always() && (needs.crawl.result == 'success' || needs.crawl.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: node bin/build-site.mjs
      - name: Check the network is built from the HOCON
        run: |
          git clone --depth 1 https://github.com/cognizant-ai-labs/agentic-web.git upstream
          node upstream/skills/agentify-website/scripts/build_network.mjs site/rayo.hocon --manifest site/agent-manifest.json --check
      - run: npm test
      - name: Build the page (Next.js export around the agent bundle in site/)
        env:
          PAGES_BASE_PATH: /rayo
        run: |
          npm ci --prefix web
          npm run build --prefix web
          npm test --prefix web
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/out
          # web/out/.well-known holds the discovery files.
          include-hidden-files: true

  # Deploying in its own job, as GitHub's starter workflow does, lets the artifact settle first.
  deploy:
    needs: [build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
